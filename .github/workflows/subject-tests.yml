name: Subject output tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: subject-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  subject-tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Lint
        run: python -m flake8 module00 module01 module02 module03 module04 tests --max-line-length=79

      - name: Run subject output checks
        run: python tests/subject_checks.py
